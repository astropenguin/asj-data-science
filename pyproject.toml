[project]
name = "asj-data-science"
version = "0.1.0"
description = "Data scientific presentations in ASJ meetings"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "beautifulsoup4>=4,<5",
    "black[jupyter]>=25,<26",
    "fire>=0.7,<1.0",
    "httpx>=0.28.1",
    "japanize-matplotlib>=1,<2",
    "jupyter>=1,<2",
    "jupyter-io>=2,<3",
    "langdetect>=1,<2",
    "matplotlib>=3,<4",
    "ndtools>=1,<2",
    "nltk>=3,<4",
    "numpy>=2,<3",
    "pandas>=2,<3",
    "pandas-stubs>=2,<3",
    "pylatexenc>=2.10",
    "pymupdf>=1,<2",
    "requests>=2,<3",
    "scikit-learn>=1,<2",
    "scipy>=1,<2",
    "sudachipy>=0.6,<1.0",
    "tqdm>=4,<5",
    "xarray>=2024,<2026",
]

[[project.authors]]
name = "Akio Taniguchi"
email = "taniguchi.akio@gmail.com"
